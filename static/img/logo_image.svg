<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AI Market Watch">
  <!--
    AI Market Watch 심볼 (docs/design.md 1.6 로고 · 심볼 · 파비콘)
    후보 C(관찰 은유) 채택안. 색은 디자인 시스템 토큰만 사용한다.
      #60269E DPLANEX Violet  (배경, 풀블리드)
      #FFFFFF White           (돋보기 링·손잡이)
      #93D500 DPLANEX Green   (렌즈)

    배경은 캔버스 전체를 채운다(바깥 여백 없음).
    rx=112(22%)는 사용자 요청으로 적용 — 조정하려면 이 값만 바꾼다
    (0 = 각진 사각, 72 = 은은함, 112 = 현재, 256 = 원형).

    심볼 배치: 링과 손잡이를 합친 바운딩박스의 중심이 캔버스 중심(256,256)에
    오도록 잡았다. 링만 가운데 두면 손잡이 무게 때문에 오른쪽 아래로 쏠려 보인다.
    링 두께 40(캔버스의 7.8%)은 16px에서 흰 테두리가 사라지지 않는 하한이라
    더 줄이지 않는다.
  -->
  <rect width="512" height="512" rx="112" fill="#60269E"/>
  <circle cx="218" cy="214" r="140" fill="#FFFFFF"/>
  <circle cx="218" cy="214" r="100" fill="#93D500"/>
  <line x1="319" y1="315" x2="410" y2="406"
        stroke="#FFFFFF" stroke-width="52" stroke-linecap="round"/>
</svg>
