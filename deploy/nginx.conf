# AI Market Watch — nginx 리버스 프록시 설정
#
# 배포 위치: /etc/nginx/conf.d/aimarketwatch.conf
# scripts/deploy.sh가 이 파일을 복사하고 `nginx -t`로 검사한 뒤 reload한다.
#
# 🔴 이 파일이 저장소에 있는 이유 (2026-09-14 신설).
# 설정을 EC2에서 직접 편집하면 오타가 프로덕션에서만 드러나고, 로컬에는 nginx가
# 없으므로(사용자 확정 — 로컬에 올리면 앞에 놓이는 것이 runserver라 프로덕션과
# 다른 조합이 된다) 무엇이 적용돼 있는지 확인할 수단이 아예 없어진다. 그 대신
# deploy.sh가 반영 직전에 `nginx -t`로 문법을 검사하고, 실패하면 이전 설정으로
# 되돌린다. 로컬 검증의 자리를 그 단계가 맡는다.

upstream aimarketwatch {
    # gunicorn은 127.0.0.1:8000만 듣는다(deploy/aimarketwatch.service).
    #
    # fail_timeout=0 — 업스트림이 하나뿐이라 "죽었다"고 판단해 잠시 빼 두어도
    # 요청을 보낼 다른 곳이 없다. 빼는 대신 매번 시도해서 502를 즉시 내는 편이
    # 원인 파악이 빠르다.
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;

    # 도메인이 연결되면 여기에 함께 적는다(SRE팀 Private Route53 요청 예정).
    # ⚠️ Amazon Linux 2023은 /etc/nginx/nginx.conf 안에 server_name _ 인 기본
    #    server 블록을 들고 있다. 그쪽이 default_server라, Host가 아래 값과
    #    정확히 일치할 때만 이 블록이 선택된다. Django의 ALLOWED_HOSTS도 같은
    #    값만 허용하므로 이 구성에서는 의도한 동작이다.
    server_name 13.209.239.47;

    # 🔴 HTTPS는 아직 없다. TLS를 이 층에서 끊게 되면
    # config/settings/production.py의 SECURE_SSL_REDIRECT와 SESSION_COOKIE_SECURE와
    # CSRF_COOKIE_SECURE를 켜고 SECURE_PROXY_SSL_HEADER를 함께 지정한다.
    # 그 파일이 "하나만 켜고 나머지를 잊으면 절반만 보호된다"고 적어 둔 지점이다.

    # 업로드 상한. 이 층에서 자르면 gunicorn 워커를 잡지 않는다. 종전에는 본문을
    # 다 받은 뒤 Django가 거절했다.
    client_max_body_size 10M;

    # 정적 파일은 nginx가 디스크에서 바로 내려준다. Python을 거치지 않는다.
    # WhiteNoise는 제거하지 않는다 — nginx가 먼저 가로채므로 중복 비용이 없고,
    # 이 블록이 어긋났을 때 앱이 여전히 정적 파일을 내려주는 안전망이 된다.
    #
    # 🔴 nginx는 nginx 사용자로 돌기 때문에 /home/ec2-user에 실행 권한(o+x)이
    #    없으면 이 경로를 열지 못하고 403이 난다. Amazon Linux 2023의 홈
    #    디렉토리 기본 권한이 700이라 실제로 걸린다. 최초 적용 시 한 번
    #    `sudo chmod o+x /home/ec2-user`가 필요하다.
    # ⚠️ expires와 add_header Cache-Control을 같이 쓰지 않는다. `expires 30d`가
    #    이미 Cache-Control: max-age=2592000을 내보내므로, add_header를 더하면
    #    응답에 Cache-Control이 두 줄 나간다(실측으로 확인하고 걷어냈다).
    #    public이 필요하면 expires를 빼고 add_header 한 줄로 합쳐 쓴다.
    location /static/ {
        alias /home/ec2-user/AI-Market-Watch/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://aimarketwatch;

        # 🔴 Host를 그대로 넘겨야 Django의 ALLOWED_HOSTS 검사가 실제 접속
        # 호스트로 이뤄진다. 안 넘기면 업스트림 이름(aimarketwatch)이 Host로
        # 들어가 모든 요청이 400이 된다.
        proxy_set_header Host              $host;

        # 🔴 이 둘이 없으면 접속자 IP가 전부 127.0.0.1로 보인다. gunicorn 입장에서
        # 요청을 보낸 주체는 nginx이기 때문이다. 로그가 통째로 쓸모없어진다.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # 바깥이 HTTPS였는지를 알려준다. WSGI에서 HTTP_X_FORWARDED_PROTO로
        # 들어오고, 나중에 SECURE_PROXY_SSL_HEADER가 읽는 값이 이것이다.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;

        # gunicorn의 --timeout 60에 맞춘다. nginx가 먼저 끊으면 아직 처리 중인
        # 요청에 504를 내보내고, 훨씬 늦게 끊으면 워커가 이미 놓은 연결을
        # 붙잡는다. 양쪽 값을 같이 움직여야 한다.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
