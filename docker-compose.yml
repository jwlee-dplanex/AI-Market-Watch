services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_market_watch_db
    # EC2가 통째로 꺼졌다 켜지는 상황(매일 19:00 정지, 수동 시작)이라 컨테이너가
    # 자동으로 다시 떠야 한다. `unless-stopped`는 "docker compose stop으로 내가
    # 직접 멈춘 게 아니면 재시작한다"는 뜻이라 EC2 재부팅에도 적용되지만,
    # `always`와 실질적으로 같은 상황에서만 쓰인다(사람이 명시적으로 stop한 적이
    # 없으므로). `always`로 둔다.
    restart: always
    environment:
      # 프로덕션에서는 DB 비밀번호를 이 파일에 평문으로 남기지 않는다. Docker
      # Compose는 같은 디렉토리의 .env를 자동으로 읽어 ${VAR} 치환에 쓰므로,
      # Django 앱이 쓰는 것과 같은 .env 파일 하나로 이 컨테이너의 자격증명도
      # 함께 관리한다(별도 관리 대상을 늘리지 않는다). EC2 .env에 DB_NAME/
      # DB_USER/DB_PASSWORD가 반드시 있어야 한다.
      #
      # 🔴 실측 함정: .env 값에 `$`가 그대로 들어 있으면 Compose가 뒤따르는
      # 문자열을 변수 참조로 오인해 그 부분을 조용히 지워버린다(예:
      # "...c#1(cb$xyz_..." → "...c#1(cb..."로 잘림, 에러 없이 길이만 짧아짐).
      # 실제로 이 리포의 DJANGO_SECRET_KEY(Django 기본 생성기가 `$`를 포함하는
      # 문자셋을 쓴다)로 재현했다. DB_PASSWORD에 `$`를 쓸 계획이면 `$$`로
      # 이스케이프해야 한다 — 이건 여기 ${DB_PASSWORD} 치환 지점에만 해당하는
      # 제약이다. Django 앱(호스트 venv에서 실행)은 environ.Env.read_env()로
      # .env를 직접 파싱하므로 이 함정 자체가 없다.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

# 🔴 2026-09-11: web 서비스(Dockerfile 기반 앱 컨테이너)는 없앴다. 「로컬과 EC2를
# 완전히 같게 한다」는 확정에 따라 앱은 이제 호스트 venv + gunicorn을 systemd
# 서비스(`aimarketwatch`)로 띄운다 — db만 여전히 여기 Docker로 남는다.
# Dockerfile·.dockerignore도 함께 지웠다: 컨테이너로 되돌아갈 계획이 없는 채로
# 남겨두면 "어느 게 실제 배포 경로인가"를 헷갈리게 만든다(이 저장소가 실제로
# 걸렸던 문제 유형이라 CLAUDE.md에도 원칙으로 박혀 있다). 필요해지면 git
# 히스토리(이 커밋 이전)에서 그대로 복원할 수 있다.

volumes:
  postgres_data:
