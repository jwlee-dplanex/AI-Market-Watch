<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Market Watch</title>

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#60269E', dark: '#401771', hover: '#4C1C80' },
            accent:  { DEFAULT: '#93D500' },
            teal:    { DEFAULT: '#00AF9A', hover: '#009583' },
          },
          borderRadius: { DEFAULT: '10px' },
          fontFamily: {
            sans:  ['Noto Sans KR', 'Inter', 'sans-serif'],
            serif: ['Noto Serif KR', 'Source Serif 4', 'serif'],
            mono:  ['JetBrains Mono', 'monospace'],
          },
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>

  <!-- Alpine.js -->
  <style>[x-cloak] { display: none !important; }</style>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <!-- 페이지 전환(예: 대시보드/지식그래프 기간 필터의 ?period= 전체 재로드) 부드럽게: 흰 화면 깜빡임 완화.
       아키텍처는 그대로(순수 <a href> GET 재로드) 두고 시각 효과만 얹는다(2026-07 PM 정책).
       1) 크로미움 계열(Chrome 126+)은 MPA View Transitions(@view-transition { navigation: auto })로
          자동 크로스페이드 — CSS 한 줄로 활성화, 미지원 브라우저는 그냥 무시(안전한 점진적 향상).
       2) 미지원 브라우저(Firefox/Safari 등)는 @supports로 감지해서 본문(main)에 순수 CSS fade-in만 적용.
          두 효과를 동시에 걸면 view transition 크로스페이드 위에 페이드가 겹쳐 이중 깜빡임처럼
          보일 수 있어 @supports not (...)으로 상호 배타적으로 나눴다.
       3) (2026-07 PM 정책 A) root 전환 그룹(전체 페이지 스냅샷)의 애니메이션은 끈다 — 그대로 두면
          안 바뀌는 사이드바(<aside>)·헤더(<header>)까지 옛/새 페이지 전체가 통째로 크로스페이드되어
          화면 전체가 깜빡이는 것처럼 보였다. 대신 본문(<main>)에만 별도 view-transition-name을 지정해
          그 영역만 독립된 전환 그룹으로 분리하고 거기에만 크로스페이드를 건다.
       이 화면(대시보드·지식그래프)뿐 아니라 사이트 전체 페이지 이동에 적용해도 자연스럽다고 판단해
       base.html에 공통으로 넣었다(개별 템플릿에 중복 적용하지 않음). -->
  <style>
    @view-transition {
      navigation: auto;
    }
    /* 전체(root) 크로스페이드는 끔 — 사이드바·헤더가 여기 휩쓸려 함께 깜빡이던 원인 */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    /* 본문 콘텐츠(<main>)만 별도 전환 그룹으로 분리해서 부드럽게 */
    main {
      view-transition-name: main-content;
    }
    ::view-transition-old(main-content),
    ::view-transition-new(main-content) {
      animation-duration: 180ms;
    }
    @supports not (view-transition-name: none) {
      @keyframes page-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      main {
        animation: page-fade-in 180ms ease-out;
      }
    }
  </style>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased">

<div class="flex h-screen overflow-hidden">

  <!-- 사이드바 -->
  <aside class="w-60 bg-[#401771] flex flex-col flex-shrink-0">
    <!-- 로고 -->
    <div class="px-6 py-5 border-b border-white/10">
      <a href="{% url 'dashboard' %}" class="flex items-center gap-2">
        <span class="text-white font-bold text-base leading-tight whitespace-nowrap">AI Market Watch</span>
      </a>
    </div>

    <!-- 네비게이션 -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <a href="{% url 'dashboard' %}"
         class="flex items-center gap-3 px-3 py-2 rounded-[10px] text-sm font-medium transition-colors
                {% if request.resolver_match.url_name == 'dashboard' %}bg-white/20 text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
        대시보드
      </a>

      <a href="{% url 'report_list' %}"
         class="flex items-center gap-3 px-3 py-2 rounded-[10px] text-sm font-medium transition-colors
                {% if 'report' in request.resolver_match.url_name %}bg-white/20 text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
        <i data-lucide="bar-chart-2" class="w-4 h-4"></i>
        보고서
      </a>

      <a href="{% url 'graph' %}"
         class="flex items-center gap-3 px-3 py-2 rounded-[10px] text-sm font-medium transition-colors
                {% if 'graph' in request.resolver_match.url_name %}bg-white/20 text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
        <i data-lucide="network" class="w-4 h-4"></i>
        지식그래프
      </a>

      <a href="{% url 'news_list' %}"
         class="flex items-center gap-3 px-3 py-2 rounded-[10px] text-sm font-medium transition-colors
                {% if 'news' in request.resolver_match.url_name %}bg-white/20 text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
        <i data-lucide="newspaper" class="w-4 h-4"></i>
        뉴스
      </a>

      <a href="{% url 'setting_sources' %}"
         class="flex items-center gap-3 px-3 py-2 rounded-[10px] text-sm font-medium transition-colors
                {% if 'setting' in request.resolver_match.url_name %}bg-white/20 text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
        <i data-lucide="settings" class="w-4 h-4"></i>
        설정
      </a>
    </nav>

    <!-- 하단 수집 상태 -->
    <div class="px-4 py-4 border-t border-white/10">
      <p class="text-xs text-white/40">마지막 수집</p>
      <p class="text-xs text-white/70 mt-0.5">{{ last_collected_at|default:"수집 기록 없음" }}</p>
    </div>
  </aside>

  <!-- 메인 영역 -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between flex-shrink-0">
      <h1 class="text-base font-semibold text-gray-900">{% block page_title %}{% endblock %}</h1>
      <div class="flex items-center gap-3">
        {% block header_actions %}{% endblock %}
      </div>
    </header>

    <!-- 콘텐츠 -->
    <main class="flex-1 overflow-y-auto p-6">
      {% block content %}{% endblock %}
    </main>

  </div>
</div>

<script>
  lucide.createIcons();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
