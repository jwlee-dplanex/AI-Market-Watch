{% comment %}
  news_body 필터(apps/news/templatetags/news_extras.py) 렌더 결과 전용 CSS.
  NEWS-002(templates/news/detail.html)와 ROOM-003(templates/newsroom/article_detail.html)이
  이 partial 하나를 {% include %}해서 공유한다(2026-09-02, PD 지적 — 두 화면 모두
  news_body 필터를 그대로 쓰므로 <style> 블록을 각자 복사하면 한쪽만 고쳐지는 사고가
  난다). dashboard/index.html에도 이름이 같은 .markdown-spacing이 있지만 그건 별개
  용도(insight.implication 마크다운)라 이 partial의 대상이 아니다 — 손대지 않는다.
{% endcomment %}
<style>
  /* word-break: keep-all — 한국어는 어절 단위로 끊어야 읽힌다. */
  .markdown-spacing { word-break: keep-all; }
  .markdown-spacing p { margin-bottom: 1.15rem; }
  .markdown-spacing p:last-child { margin-bottom: 0; }
  .markdown-spacing ul, .markdown-spacing ol { margin: 0 0 1.15rem 1.25rem; }
  .markdown-spacing ul:last-child, .markdown-spacing ol:last-child { margin-bottom: 0; }
  .markdown-spacing ul { list-style: disc; }
  .markdown-spacing ol { list-style: decimal; }
  .markdown-spacing li { margin-bottom: 0.45rem; }

  {% comment %}
  news_body 필터가 판정한 소제목(news-subtitle 클래스) 스타일. 본문 글자 크기(14px =
  0.875rem)는 유지하고 font-weight로만 구분한다. reports/detail.html의
  .markdown-content h1~h6과 같은 톤(0.875rem, font-weight 600, color #111827).
  위/아래 여백을 다르게 줘 "덩어리"를 시각적으로 가른다 — 위 문단과는 넉넉히
  띄우고 바로 아래 문단과는 가깝게 붙여, 이 소제목이 다음에 오는 문단들의
  표제라는 걸 여백만으로 드러낸다.
  {% endcomment %}
  .markdown-spacing p.news-subtitle {
    font-weight: 600;
    color: #111827;
    margin-top: 1.75rem;
    margin-bottom: 0.5rem;
  }
  .markdown-spacing p.news-subtitle:first-child { margin-top: 0; }
</style>
