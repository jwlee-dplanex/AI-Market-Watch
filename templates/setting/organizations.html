{% extends "setting/base_setting.html" %}


{% block setting_content %}
<div x-data="{ activeTab: '전체', modalOpen: false, editOrg: null }">

  <!-- 헤더 -->
  <div class="flex items-center justify-between mb-4">
    <!-- 유형 탭 필터 -->
    <div class="flex gap-1 bg-white rounded-[10px] shadow-sm p-1">
      <button @click="activeTab = '전체'"
              class="px-3 py-1.5 text-xs font-medium rounded-[10px] transition-colors"
              :class="activeTab === '전체' ? 'bg-primary text-white' : 'text-gray-500 hover:bg-gray-50'">
        전체 <span class="ml-1 opacity-70">{{ total_count }}</span>
      </button>
      {% for value, label in org_types %}
      <button @click="activeTab = '{{ value }}'"
              class="px-3 py-1.5 text-xs font-medium rounded-[10px] transition-colors"
              :class="activeTab === '{{ value }}' ? 'bg-primary text-white' : 'text-gray-500 hover:bg-gray-50'">
        {{ label }}
      </button>
      {% endfor %}
    </div>
    <button @click="modalOpen=true; editOrg=null"
            class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-white bg-primary rounded-[10px] hover:bg-primary-hover transition-colors">
      <i data-lucide="plus" class="w-3.5 h-3.5"></i> 기관 추가
    </button>
  </div>

  <!-- 기관 추가/수정 Modal -->
  <div x-show="modalOpen" x-transition
       class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center"
       @keydown.escape.window="modalOpen=false">
    <div class="bg-white rounded-[10px] shadow-lg border border-[#E5E5E5] w-full max-w-md p-6"
         @click.stop>
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-sm font-semibold text-gray-900"
            x-text="editOrg ? '기관 수정' : '기관 추가'"></h3>
        <button type="button" @click="modalOpen=false"
                class="text-gray-400 hover:text-gray-600 transition-colors">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <form hx-post="{% url 'setting_organization_save' %}"
            hx-target="#org-table" hx-swap="innerHTML"
            hx-include="[name=csrfmiddlewaretoken]"
            @htmx:afterRequest.window="if(event.detail.successful){ modalOpen=false; $el.reset() }">
        <input type="hidden" name="org_id" :value="editOrg ? editOrg.id : ''">
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">기관명 <span class="text-[#D92D20]">*</span></label>
            <input type="text" name="name"
                   x-effect="$el.value = editOrg ? editOrg.name : ''"
                   placeholder="예: KB국민은행" required
                   class="w-full text-sm border border-[#E5E5E5] rounded-[10px] px-3 py-2 focus:outline-none focus:border-primary focus:ring-2 focus:ring-[rgba(96,38,158,0.14)]">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">유형 <span class="text-[#D92D20]">*</span></label>
            <select name="org_type" required
                    x-effect="$el.value = editOrg ? editOrg.org_type : ''"
                    class="w-full text-sm border border-[#E5E5E5] rounded-[10px] px-3 py-2 focus:outline-none focus:border-primary focus:ring-2 focus:ring-[rgba(96,38,158,0.14)]">
              <option value="">유형 선택</option>
              {% for value, label in org_types %}
              <option value="{{ value }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">별칭</label>
            <input type="text" name="aliases"
                   x-effect="$el.value = editOrg ? editOrg.aliases_str : ''"
                   placeholder="예: 국민은행, KB (쉼표로 구분)"
                   class="w-full text-sm border border-[#E5E5E5] rounded-[10px] px-3 py-2 focus:outline-none focus:border-primary focus:ring-2 focus:ring-[rgba(96,38,158,0.14)]">
          </div>
        </div>
        <div class="flex gap-3 mt-6 justify-end">
          <button type="button" @click="modalOpen=false"
                  class="px-4 py-2 text-[#54565A] text-sm rounded-[10px] border border-[#E5E5E5] hover:border-primary hover:text-primary transition-colors">취소</button>
          <button type="submit"
                  class="px-4 py-2 bg-primary text-white text-sm font-medium rounded-[10px] hover:bg-primary-hover transition-colors">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 유형별 섹션 (HTMX target) -->
  {% csrf_token %}
  <div id="org-table">
    {% include "setting/_organizations.html" %}
  </div>

</div>
{% endblock %}
