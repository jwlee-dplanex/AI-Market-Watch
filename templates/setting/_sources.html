<div id="sources-panel">
  <table class="w-full text-sm">
    <thead>
      <tr class="border-b border-gray-100">
        <th class="text-left text-xs font-semibold text-gray-500 px-5 py-3">소스명</th>
        <th class="text-left text-xs font-semibold text-gray-500 py-3">URL</th>
        <th class="text-left text-xs font-semibold text-gray-500 py-3 w-20">유형</th>
        <th class="text-left text-xs font-semibold text-gray-500 py-3 w-28">수집 주기</th>
        <th class="text-left text-xs font-semibold text-gray-500 py-3 w-20">활성</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-50">
      {% for source in sources %}
      <tr class="hover:bg-gray-50 transition-colors">
        <td class="px-5 py-3 text-xs font-medium text-gray-900">{{ source.name }}</td>
        <td class="py-3 pr-4 text-xs text-gray-500 truncate max-w-xs">{{ source.url }}</td>
        <td class="py-3 text-xs">
          <span class="px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">{{ source.source_type|upper }}</span>
        </td>
        <td class="py-3 text-xs text-gray-500">{{ source.schedule|default:"—" }}</td>
        <td class="py-3">
          <button type="button"
                  hx-post="{% url 'setting_source_toggle' source.pk %}"
                  hx-target="#sources-panel"
                  hx-swap="outerHTML"
                  hx-include="[name=csrfmiddlewaretoken]"
                  class="relative w-8 h-4 rounded-full transition-colors {% if source.is_active %}bg-primary{% else %}bg-gray-200{% endif %}">
            <span class="absolute top-0.5 w-3 h-3 rounded-full bg-white shadow-sm transition-all {% if source.is_active %}left-4{% else %}left-0.5{% endif %}"></span>
          </button>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="5" class="px-5 py-10 text-center text-xs text-gray-400">등록된 데이터 소스가 없습니다.</td></tr>
      {% endfor %}
    </tbody>
  </table>

  <div class="px-5 py-4 border-t border-gray-100 flex items-center gap-3">
    <button type="button"
            hx-post="{% url 'setting_collect_now' %}"
            hx-target="#collect-result"
            hx-swap="innerHTML"
            hx-include="[name=csrfmiddlewaretoken]"
            hx-indicator="#collect-spinner"
            class="flex items-center gap-1.5 px-4 py-2 bg-primary text-white text-xs font-medium rounded-[10px] hover:bg-primary-hover transition-colors disabled:opacity-50">
      <i data-lucide="play" class="w-3.5 h-3.5"></i>
      지금 수집
    </button>
    <span id="collect-spinner"
          class="htmx-indicator text-xs text-gray-400 flex items-center gap-1.5">
      <svg class="animate-spin w-3.5 h-3.5 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
      </svg>
      수집 중...
    </span>

    <button type="button"
            hx-post="{% url 'setting_process_llm_now' %}"
            hx-target="#llm-result"
            hx-swap="innerHTML"
            hx-include="[name=csrfmiddlewaretoken]"
            hx-indicator="#llm-spinner"
            class="flex items-center gap-1.5 px-4 py-2 bg-[#00AF9A] text-white text-xs font-medium rounded-[10px] hover:bg-teal-600 transition-colors disabled:opacity-50">
      <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
      AI 처리
    </button>
    <span id="llm-spinner"
          class="htmx-indicator text-xs text-gray-400 flex items-center gap-1.5">
      <svg class="animate-spin w-3.5 h-3.5 text-[#00AF9A]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
      </svg>
      처리 중...
    </span>
  </div>

  <div id="collect-result"></div>
  <div id="llm-result"></div>
</div>
