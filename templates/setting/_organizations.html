{% for group in grouped %}
<div x-show="activeTab === '전체' || activeTab === '{{ group.type }}'" x-cloak class="mb-6">

  <!-- 섹션 헤더 -->
  <div class="flex items-center gap-3 mb-2 px-1">
    <span class="text-xs font-semibold px-2.5 py-1 rounded-full
      {% if group.type == '금융사' %}bg-blue-100 text-blue-700
      {% elif group.type == '보험사' %}bg-[#E6F7F5] text-[#00AF9A]
      {% elif group.type == 'AI' %}bg-[#F3EAFB] text-primary
      {% endif %}">
      {{ group.label }}
    </span>
    <span class="text-xs text-gray-400">{{ group.count }}개</span>
    <div class="flex-1 h-px bg-gray-100"></div>
  </div>

  <!-- 기관 테이블 -->
  <div class="bg-white rounded-[10px] shadow-sm overflow-hidden">
    {% if group.orgs %}
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-100">
          <th class="text-left text-xs font-semibold text-gray-400 px-5 py-2.5">기업명</th>
          <th class="text-left text-xs font-semibold text-gray-400 py-2.5">별칭</th>
          <th class="text-left text-xs font-semibold text-gray-400 py-2.5 w-16">활성</th>
          <th class="py-2.5 w-14"></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-50">
        {% for org in group.orgs %}
        <tr class="hover:bg-gray-50 transition-colors">
          <td class="px-5 py-3 text-xs font-medium text-gray-900">{{ org.name }}</td>
          <td class="py-3 pr-4">
            <div class="flex flex-wrap gap-1">
              {% for alias in org.aliases %}
              <span class="text-xs bg-gray-50 text-gray-500 border border-[#E5E5E5] px-1.5 py-0.5 rounded">{{ alias }}</span>
              {% empty %}
              <span class="text-xs text-gray-300">—</span>
              {% endfor %}
            </div>
          </td>
          <td class="py-3">
            <button type="button"
                    hx-post="{% url 'setting_organization_toggle' org.pk %}"
                    hx-target="#org-table" hx-swap="innerHTML"
                    hx-include="[name=csrfmiddlewaretoken]"
                    class="inline-flex w-8 h-4 rounded-full items-center cursor-pointer transition-colors
                           {% if org.is_active %}bg-primary{% else %}bg-gray-200{% endif %}">
              <span class="w-3 h-3 rounded-full bg-white shadow-sm transition-all
                           {% if org.is_active %}ml-4{% else %}ml-0.5{% endif %}"></span>
            </button>
          </td>
          <td class="py-3 pr-4 text-right">
            <div class="flex items-center justify-end gap-2">
              <button type="button"
                      @click="modalOpen=true; editOrg={id:{{ org.pk }}, name:'{{ org.name|escapejs }}', org_type:'{{ org.org_type }}', aliases_str:'{{ org.aliases|join:', '|escapejs }}'}"
                      class="text-gray-300 hover:text-primary transition-colors">
                <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
              </button>
              <button type="button"
                      hx-post="{% url 'setting_organization_delete' org.pk %}"
                      hx-target="#org-table" hx-swap="innerHTML"
                      hx-include="[name=csrfmiddlewaretoken]"
                      hx-confirm="'{{ org.name }}' 기업을 삭제하시겠습니까? 뉴스와의 연결도 함께 해제됩니다."
                      class="text-gray-300 hover:text-red-500 transition-colors">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p class="px-5 py-6 text-center text-xs text-gray-400">등록된 기업이 없습니다.</p>
    {% endif %}
  </div>

</div>
{% endfor %}
<script>lucide.createIcons();</script>
