{% extends "setting/base_setting.html" %}


{% block setting_content %}
<div class="bg-white rounded-[10px] shadow-sm">
  <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
    <h2 class="text-sm font-semibold text-gray-900">데이터 소스 관리</h2>
    <button class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-white bg-primary rounded-[10px] hover:bg-primary-hover transition-colors">
      <i data-lucide="plus" class="w-3.5 h-3.5"></i> 소스 추가
    </button>
  </div>
  <table class="w-full text-sm">
    <thead>
      <tr class="border-b border-gray-100">
        <th class="text-left text-xs font-semibold text-gray-500 px-5 py-3">소스명</th>
        <th class="text-left text-xs font-semibold text-gray-500 py-3">URL</th>
        <th class="text-left text-xs font-semibold text-gray-500 py-3 w-20">유형</th>
        <th class="text-left text-xs font-semibold text-gray-500 py-3 w-28">수집 주기</th>
        <th class="text-left text-xs font-semibold text-gray-500 py-3 w-16">활성</th>
        <th class="py-3 w-20"></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-50">
      {% for source in sources %}
      <tr class="hover:bg-gray-50 transition-colors">
        <td class="px-5 py-3 text-xs font-medium text-gray-900">{{ source.name }}</td>
        <td class="py-3 pr-4 text-xs text-gray-500 truncate max-w-xs">{{ source.url }}</td>
        <td class="py-3 text-xs">
          <span class="px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">{{ source.source_type|upper }}</span>
        </td>
        <td class="py-3 text-xs text-gray-500">{{ source.schedule }}</td>
        <td class="py-3">
          <span class="w-8 h-4 rounded-full flex items-center {% if source.is_active %}bg-primary{% else %}bg-gray-200{% endif %}">
            <span class="w-3 h-3 rounded-full bg-white shadow-sm ml-{% if source.is_active %}4{% else %}0.5{% endif %}"></span>
          </span>
        </td>
        <td class="py-3 pr-4 text-right">
          <button class="text-xs text-gray-400 hover:text-primary transition-colors">수정</button>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="6" class="px-5 py-10 text-center text-xs text-gray-400">등록된 데이터 소스가 없습니다.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
