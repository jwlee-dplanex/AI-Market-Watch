{% extends "setting/base_setting.html" %}

{% block setting_content %}
<div x-data="{ modalOpen: false, editSched: null }">

  <!-- 헤더 -->
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-sm font-semibold text-gray-900">수집 스케줄</h2>
    <button @click="editSched = null; modalOpen = true"
            class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-white bg-primary rounded-[10px] hover:bg-primary-hover transition-colors">
      <i data-lucide="plus" class="w-3.5 h-3.5"></i> 스케줄 추가
    </button>
  </div>

  <!-- 스케줄 목록 (HTMX target) -->
  {% csrf_token %}
  <div id="schedule-list" class="space-y-4">
    {% include "setting/_schedule_list.html" %}
  </div>

  <!-- 추가/수정 모달 -->
  <div x-show="modalOpen" x-cloak x-transition
       class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center"
       @keydown.escape.window="modalOpen = false">
    <div class="bg-white rounded-[10px] shadow-lg w-full max-w-md p-6" @click.stop>
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-sm font-semibold text-gray-900" x-text="editSched ? '스케줄 수정' : '스케줄 추가'"></h3>
        <button @click="modalOpen = false">
          <i data-lucide="x" class="w-4 h-4 text-gray-400"></i>
        </button>
      </div>
      <form hx-post="{% url 'setting_schedule_save' %}"
            hx-target="#schedule-list" hx-swap="innerHTML"
            hx-include="[name=csrfmiddlewaretoken]"
            @htmx:after-request="if(event.detail.successful) modalOpen = false">
        <input type="hidden" name="pk" :value="editSched ? editSched.pk : ''">
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">유형</label>
            <select name="schedule_type"
                    x-effect="$el.value = editSched ? editSched.type : 'collect'"
                    class="w-full text-sm border border-gray-200 rounded-[10px] px-3 py-2 focus:outline-none focus:border-primary">
              <option value="collect">뉴스 수집</option>
              <option value="report">보고서 생성</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">cron 표현식</label>
            <input type="text" name="cron_expr"
                   x-effect="$el.value = editSched ? editSched.cron : ''"
                   placeholder="예: 0 6 * * *  (매일 새벽 6시)"
                   class="w-full font-mono text-sm border border-gray-200 rounded-[10px] px-3 py-2 focus:outline-none focus:border-primary">
            <p class="text-xs text-gray-400 mt-1">분 시 일 월 요일 순서 (5자리 cron 형식)</p>
          </div>
          <div class="flex items-center gap-2">
            <input type="checkbox" name="is_active" id="is_active"
                   x-effect="$el.checked = editSched ? editSched.active : true"
                   class="rounded text-primary">
            <label for="is_active" class="text-xs text-gray-700">즉시 활성화</label>
          </div>
        </div>
        <div class="flex gap-3 mt-6 justify-end">
          <button type="button" @click="modalOpen = false"
                  class="px-4 py-2 text-sm text-gray-500 border border-gray-200 rounded-[10px] hover:border-primary transition-colors">취소</button>
          <button type="submit"
                  class="px-4 py-2 bg-primary text-white text-sm rounded-[10px] hover:bg-primary-hover transition-colors">저장</button>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
