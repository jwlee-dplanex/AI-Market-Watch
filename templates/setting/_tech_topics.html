<div class="bg-white rounded-[10px] border border-[#E5E5E5] shadow-sm overflow-hidden">
  {% if topics %}
  <table class="w-full text-sm">
    <thead>
      <tr class="border-b border-gray-100">
        <th class="text-left text-xs font-semibold text-gray-400 px-5 py-2.5">주제명</th>
        <th class="text-left text-xs font-semibold text-gray-400 py-2.5">별칭</th>
        <th class="text-left text-xs font-semibold text-gray-400 py-2.5 w-20">연결 뉴스</th>
        <th class="text-left text-xs font-semibold text-gray-400 py-2.5 w-16">활성</th>
        <th class="py-2.5 w-14"></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-50">
      {% for topic in topics %}
      <tr class="hover:bg-gray-50 transition-colors">
        <td class="px-5 py-3 text-xs font-medium text-gray-900">{{ topic.name }}</td>
        <td class="py-3 pr-4">
          <div class="flex flex-wrap gap-1">
            {% for alias in topic.aliases %}
            <span class="text-xs bg-gray-50 text-gray-500 border border-[#E5E5E5] px-1.5 py-0.5 rounded">{{ alias }}</span>
            {% empty %}
            <span class="text-xs text-gray-300">—</span>
            {% endfor %}
          </div>
        </td>
        <td class="py-3 pr-4 text-xs {% if topic.news_count == 0 %}text-gray-300{% else %}text-gray-700{% endif %}">
          {{ topic.news_count }}건
        </td>
        <td class="py-3">
          <button type="button"
                  hx-post="{% url 'setting_tech_topic_toggle' topic.pk %}"
                  hx-target="#tech-topic-table" hx-swap="innerHTML"
                  hx-include="[name=csrfmiddlewaretoken]"
                  class="inline-flex w-8 h-4 rounded-full items-center cursor-pointer transition-colors
                         {% if topic.is_active %}bg-primary{% else %}bg-gray-200{% endif %}">
            <span class="w-3 h-3 rounded-full bg-white shadow-sm transition-all
                         {% if topic.is_active %}ml-4{% else %}ml-0.5{% endif %}"></span>
          </button>
        </td>
        <td class="py-3 pr-4 text-right">
          <div class="flex items-center justify-end gap-2">
            <button type="button"
                    @click="modalOpen=true; editTopic={id:{{ topic.pk }}, name:'{{ topic.name|escapejs }}', aliases_str:'{{ topic.aliases|join:', '|escapejs }}'}"
                    class="text-gray-300 hover:text-primary transition-colors">
              <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
            </button>
            <button type="button"
                    hx-post="{% url 'setting_tech_topic_delete' topic.pk %}"
                    hx-target="#tech-topic-table" hx-swap="innerHTML"
                    hx-include="[name=csrfmiddlewaretoken]"
                    hx-confirm="'{{ topic.name }}' 기술 주제를 삭제하시겠습니까? 뉴스와의 연결도 함께 해제됩니다."
                    class="text-gray-300 hover:text-red-500 transition-colors">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p class="px-5 py-6 text-center text-xs text-gray-400">등록된 기술 주제가 없습니다.</p>
  {% endif %}
</div>
<script>lucide.createIcons();</script>
